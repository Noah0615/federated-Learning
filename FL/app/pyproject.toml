[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-challenge-telemetry"
version = "0.1.0"
description = "Controlled Flower deployment runtime for challenge telemetry experiments"
requires-python = ">=3.10"
dependencies = [
  "flwr==1.34.0",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<20",
  "pyyaml>=6,<7",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["challenge", "attackers"]

[tool.flwr.app]
publisher = "fl-challenge-telemetry"

[tool.flwr.app.components]
serverapp = "challenge.server_app:app"
clientapp = "challenge.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
fraction-train = 1.0
fraction-evaluate = 1.0
min-available-nodes = 5
batch-size = 64
local-epochs = 1
learning-rate = 0.05
delta-sigma = 0.0
delta-seed = 20260827
mnist-max-samples = 2000
results-dir = "/results"

